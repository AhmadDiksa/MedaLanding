<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Hero Isometric</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdfdfb;--fg:#111;--ln:#ece8e1;--lime:#e8ff93;--beige:#ebe6df;--sh:#d9d4cc;--bd:#333;--tb:#e6e0d4;--stroke:#e5322d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130f;--fg:#f5f2ea;--ln:#25231c;--lime:#d6f06a;--beige:#2a2822;--sh:#000;--bd:#8a867a;--tb:#25231c}}
:root[data-theme="dark"]{--bg:#14130f;--fg:#f5f2ea;--ln:#25231c;--lime:#d6f06a;--beige:#2a2822;--sh:#000;--bd:#8a867a;--tb:#25231c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;text-transform:uppercase}
.hero{position:relative;overflow:hidden;background:var(--bg);border-top:3px solid var(--tb);height:max(41.7vw,640px)}
.gridbg{position:absolute;top:0;bottom:0;left:50%;right:0;border-left:1px solid var(--ln);background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:106px 100px;animation:gi 1.4s ease both}
@keyframes gi{from{opacity:0}}
.copy{position:relative;z-index:50;padding:clamp(34px,6.7vw,140px) max(20px,2vw) 0;max-width:46vw}
.fade{animation:up .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0)*.09s + .1s)}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.badge{display:inline-block;border:1.5px solid var(--fg);border-radius:99px;padding:.55em 1.1em;font-size:max(12px,.95vw);font-weight:500}
h1{margin:3.1vw 0 1.6vw;font-size:max(38px,3.8vw);line-height:1;font-weight:500;letter-spacing:-.04em}
.sub{max-width:36vw;font-size:max(16px,1.37vw);line-height:1.6}
.price{margin-top:1.4vw;font-size:max(17px,1.45vw);font-weight:700}
.cta{display:flex;flex-wrap:wrap;gap:1.6vw;margin-top:2.5vw}
.btn{display:flex;align-items:stretch;height:max(40px,3.1vw);border:1px solid var(--bd);color:var(--fg);font-size:max(12px,.95vw);font-weight:500;text-decoration:none;box-shadow:.35vw .35vw 0 var(--sh);transition:transform .18s,box-shadow .18s}
.btn span{display:flex;align-items:center;padding:0 1.5vw}
.btn:hover{transform:translate(.2vw,.2vw);box-shadow:.15vw .15vw 0 var(--sh)}
.btn:active{transform:translate(.35vw,.35vw);box-shadow:none}
.pr{background:var(--lime);color:#111}.pr .arr{border-left:1px solid var(--bd);padding:0 1.2vw;font-size:1.3em;transition:padding .18s}
.pr:hover .arr{padding:0 1.6vw 0 1.2vw}.se{background:var(--beige)}
.scene{position:absolute;inset:0;z-index:1;pointer-events:none}
.world{position:absolute;left:0;top:0;width:1905px;height:795px;transform-origin:0 0;transform:translate(var(--x,0px),0) scale(var(--s,1))}
.par{position:absolute;left:0;top:0;width:0;height:0;transform:translate(calc(var(--mx,0)*var(--d,0)*-1px),calc(var(--my,0)*var(--d,0)*-.6px))}
.pos{position:absolute;animation:enter 1s cubic-bezier(.2,.8,.2,1) both,bob 7s ease-in-out infinite;animation-delay:calc(var(--i,0)*.09s + .25s),calc(var(--i,0)*-.7s)}
@keyframes enter{from{opacity:0;transform:translate(-140px,80px)}to{opacity:1;transform:none}}
@keyframes bob{50%{translate:10px -6px}}
.iso{position:relative;transform-origin:0 0;transform:skewY(29.5deg) scaleX(.866);box-shadow:0 0 0 3px var(--stroke),-8px 6px 18px rgba(0,0,0,.1);transition:translate .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;pointer-events:auto;overflow:hidden}
.iso img{display:block;width:100%;height:100%;object-fit:cover;user-select:none}
.iso:hover{translate:-18px 10px;box-shadow:0 0 0 3px var(--stroke),-22px 16px 34px rgba(0,0,0,.22)}
.iso:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
.iso:hover:after{transform:translateX(120%)}
.pill{width:max-content;padding:9px 20px;background:#fff;color:#111;border:2px solid #111;border-radius:99px;font-size:17px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:visible;pointer-events:none}
.pill{box-shadow:none}.pill:after{display:none}
.pp{animation-name:enter,bp}@keyframes bp{50%{translate:16px -9px}}
@media (max-width:820px){.hero{height:auto}.copy{max-width:none;padding:56px 22px 8px}.sub{max-width:none}h1{margin:22px 0 14px}.cta{gap:16px;margin-top:22px}.btn{box-shadow:4px 4px 0 var(--sh)}.scene{position:relative;height:62vw}.gridbg{left:0;top:auto;height:62vw}}
@media (prefers-reduced-motion:reduce){.pos,.fade,.gridbg{animation:none}.iso,.iso:after{transition:none}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="gridbg"></div>
  <div class="copy">
    <span class="badge mono fade" style="--n:0">Now available – REST API</span>
    <h1 class="fade" style="--n:1">Automate your<br>direct mail at scale.</h1>
    <p class="sub fade" style="--n:2">Create, personalize, and send postcards, letters, and invoices through a powerful API or intuitive dashboard.</p>
    <p class="price fade" style="--n:3">Starting at $0.49 per piece.</p>
    <div class="cta fade" style="--n:4">
      <a class="btn pr mono" href="#"><span>Start sending</span><span class="arr">→</span></a>
      <a class="btn se mono" href="#"><span>View API docs</span></a>
    </div>
  </div>
  <div class="scene"><div class="world" id="world"></div></div>
</section>
<script>
// Gambar kartu dibuat sebagai SVG data-URI supaya demo tetap memakai <img>. Di project asli ganti dengan /hero/cards/<name>.png
function U(w,h,b){return "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+b+'</svg>')}
var A="font-family='Arial,Helvetica,sans-serif'",M="font-family='Courier New,monospace'",G="font-family='Georgia,serif' font-style='italic'";
var chk='<pattern id="c" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#111"/><rect x="8" y="8" width="8" height="8" fill="#111"/></pattern>';
var str='<pattern id="s" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="20" height="60" fill="#ff6a2b"/><rect x="30" width="20" height="60" fill="#4f86ef"/></pattern>';
var pm=function(x,y,t){return '<circle cx="'+x+'" cy="'+y+'" r="48" fill="none" stroke="#9fb2ff" stroke-width="3"/><text x="'+x+'" y="'+(y+4)+'" '+M+' font-size="11" fill="#9fb2ff" text-anchor="middle">'+t+'</text>'};
var C=[
["honey",1745,0,300,430,'<defs><pattern id="h" width="40" height="46" patternUnits="userSpaceOnUse"><path d="M20 2l17 10v22L20 44 3 34V12z" fill="#f2b32e" stroke="#9a5a05" stroke-width="3"/></pattern></defs><rect width="300" height="430" fill="url(#h)"/>'],
["navy",1603,22,520,440,'<defs>'+str+'</defs><rect width="520" height="440" fill="#1f2150"/><rect width="520" height="16" fill="url(#s)"/><rect x="504" width="16" height="440" fill="url(#s)"/>'+pm(80,100,"NAIROBI")+pm(190,80,"SEP 17, 2020")+pm(300,120,"MANILA")+'<text x="40" y="200" '+M+' font-size="13" fill="#9fb2ff">A NOTE FOR YOU, MR. KRUGER</text><rect x="270" y="150" width="210" height="150" fill="none" stroke="#ff6a2b" stroke-width="4"/><text x="284" y="200" '+A+' font-weight="800" font-size="40" fill="#ff6a2b">2.4 MILLION</text><text x="284" y="242" '+A+' font-weight="800" font-size="40" fill="#ff6a2b">HUMANS</text><text x="284" y="284" '+A+' font-weight="800" font-size="40" fill="#ff6a2b">HELPED</text>'],
["yellow",1503,142,337,430,'<rect width="337" height="430" fill="#f9df4a"/><g '+A+' font-weight="800" font-size="62" fill="#111" letter-spacing="-3"><text x="34" y="130">design</text><text x="34" y="190">meets</text><text x="34" y="250">atmosphere.</text></g><rect y="270" width="337" height="46" fill="#d9d9d4"/><text x="24" y="298" '+A+' font-size="13" fill="#444">A statement lamp designed to</text><rect y="316" width="337" height="114" fill="#2a2a14"/><path d="M130 340a45 32 0 0 1 90 0z" fill="#e6c52c"/><rect x="168" y="372" width="16" height="58" fill="#c9a91f"/>'],
["quiet",1310,262,390,490,'<rect width="390" height="490" fill="#ead9d0"/><circle cx="10" cy="180" r="70" fill="#ff5a0a"/><ellipse cx="380" cy="270" rx="60" ry="75" fill="#ff2ea6"/><ellipse cx="380" cy="490" rx="80" ry="90" fill="#ff5a0a"/><text x="28" y="50" '+M+' font-size="20" fill="#b3562a" letter-spacing="3">A QUIET HOME</text><g '+M+' font-size="28" font-weight="700" fill="#a8431c"><text x="150" y="250">DESIGNED FOR</text><text x="150" y="284">EVERYDAY LIFE</text></g><g '+A+' font-size="44" font-weight="800" fill="#ff5a0a" letter-spacing="-2"><text x="30" y="400">SIMPLE AND</text><text x="30" y="445">FUNCTIONAL</text></g>'],
["lumina",1103,360,470,560,'<defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c78a7c"/><stop offset="1" stop-color="#8d5a54"/></linearGradient>'+chk+'</defs><rect width="470" height="560" fill="#a96b63"/><rect width="210" height="560" fill="url(#p)"/><ellipse cx="115" cy="200" rx="52" ry="68" fill="#e3b49a"/><ellipse cx="115" cy="400" rx="85" ry="130" fill="#3a2a24"/><text x="26" y="40" '+G+' font-size="22" fill="#f6dcc9">Lumina Botanics</text><g '+G+' font-size="46" fill="#f1c9a0"><text x="226" y="180">Come back</text><text x="226" y="228">today,</text><text x="226" y="276">Sherri!</text></g><text x="226" y="320" '+A+' font-size="13" fill="#f6dcc9">We\'ve missed you! Here\'s a special</text><text x="226" y="338" '+A+' font-size="13" fill="#f6dcc9">gift to welcome you back.</text><rect x="226" y="360" width="200" height="200" rx="6" fill="#fff"/><rect x="246" y="396" width="96" height="96" fill="url(#c)"/><text x="240" y="384" '+A+' font-size="10" font-weight="700" fill="#111">SCAN FOR YOUR OFFER</text><text x="352" y="450" '+A+' font-size="22" font-weight="800" fill="#111">20%</text>'],
["invoice",993,455,331,520,'<rect width="331" height="520" fill="#eef2ee"/><text x="18" y="40" '+A+' font-size="11" fill="#444">Invoice 524</text><text x="110" y="76" '+A+' font-size="18" font-weight="600" fill="#b4531f">Melanie Kassidy Home</text><g fill="#c9d0c9"><rect x="110" y="110" width="140" height="8"/><rect x="110" y="128" width="100" height="8"/><rect x="110" y="190" width="200" height="8"/><rect x="110" y="215" width="170" height="8"/><rect x="110" y="240" width="190" height="8"/></g><rect x="270" y="440" width="40" height="40" rx="10" fill="#111"/><text x="290" y="466" '+A+' font-size="18" fill="#fff" text-anchor="middle">↗</text>'],
["lime",773,572,440,560,'<rect width="440" height="560" fill="#d8f88f"/><rect x="18" y="18" width="404" height="524" fill="none" stroke="#4d6b00" stroke-width="2" stroke-dasharray="8 6"/><text x="40" y="82" '+M+' font-size="24" font-weight="700" fill="#3a5200" letter-spacing="1">TAKE 25% OFF SITEWIDE</text><text x="30" y="270" '+M+' font-size="170" font-weight="700" fill="#4d6b00" letter-spacing="-12">CYBER</text>'],
["qr",588,640,420,520,'<defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c73"/><stop offset="1" stop-color="#0f2133"/></linearGradient></defs><rect width="420" height="520" fill="url(#b)"/><path d="M40 330q40-70 120-72h120q60 0 90 70v30H40z" fill="#0a141f"/><circle cx="110" cy="365" r="26" fill="#233"/><circle cx="310" cy="365" r="26" fill="#233"/><rect x="14" y="14" width="30" height="30" rx="8" fill="#111"/>'],
["sofia",480,705,310,520,'<rect width="310" height="520" fill="#fff"/><text x="20" y="34" '+M+' font-size="9" fill="#e5322d">INVOICE</text><g '+M+' font-size="40" font-weight="700" fill="#e5322d" letter-spacing="-4"><text x="20" y="90">SOFIA</text><text x="20" y="130">PHOTO</text></g>'],
["last",308,757,310,520,'<rect width="310" height="520" fill="#dff3df"/><text x="16" y="44" '+A+' font-size="16" font-weight="700" fill="#264d26">ALL THE THINGS</text>']
];
var P=[["Canvas editor",1530,195],["PDF upload",1222,672],["QR code tracking",617,692]];
var w=document.getElementById("world"),h="";
C.forEach(function(c,i){h+='<div class="par" style="--d:'+(i+1)*3+';z-index:'+(i+1)+'"><div class="pos" style="left:'+c[1]+'px;top:'+c[2]+'px;--i:'+i+'"><div class="iso" style="width:'+c[3]+'px;height:'+c[4]+'px"><img src="'+U(c[3],c[4],c[5])+'" alt="'+c[0]+'" width="'+c[3]+'" height="'+c[4]+'" draggable="false"></div></div></div>'});
P.forEach(function(p,i){h+='<div class="par" style="--d:'+(40+i*6)+';z-index:30"><div class="pos pp" style="left:'+p[1]+'px;top:'+p[2]+'px;--i:'+(10+i)+'"><div class="iso pill mono">'+p[0]+'</div></div></div>'});
w.innerHTML=h;
var hero=document.getElementById("hero");
function fit(){var W=hero.clientWidth,H=hero.clientHeight,s,x;if(W<=820){s=W/1145;x=-760*s}else{s=Math.max(W/1905,H/795);x=W-1905*s}w.style.setProperty("--s",s);w.style.setProperty("--x",x+"px")}
new ResizeObserver(fit).observe(hero);fit();
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
var tx=0,ty=0,cx=0,cy=0;
hero.addEventListener("pointermove",function(e){var r=hero.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2});
hero.addEventListener("pointerleave",function(){tx=ty=0});
(function t(){cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;w.style.setProperty("--mx",cx.toFixed(3));w.style.setProperty("--my",cy.toFixed(3));requestAnimationFrame(t)})();
}
</script>
</body>
</html>
